<svg xmlns="http://www.w3.org/2000/svg" width="760" height="628" viewBox="0 0 760 628" role="img" aria-labelledby="title desc">
<title id="title">先分清楚，你要修正哪一種內容</title><desc id="desc">概念示意，並非產品操作畫面</desc>
<style>text{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif} .label{font-size:34px;font-weight:700;fill:#f4edff}.body{font-size:32px;fill:#d7d4e0}.sub{font-size:28px;fill:#d7d4e0}</style>
<rect width="760" height="628" rx="24" fill="#19151f"/>
<text x="36" y="57" class="label">先分清楚，你要修正哪一種內容</text>
<text x="36" y="100" class="sub">概念示意，並非產品操作畫面</text>
<rect x="26" y="136" width="708" height="140" rx="15" fill="#2b213a" stroke="#59406f"/>
<text x="47" y="179" class="label">長期記憶｜故事的大方向</text>
<text x="47" y="222" class="body">「我們在燈塔前談開了誤會。」</text>
<text x="47" y="262" class="body">查看摘要是否遺漏、寫錯或互相矛盾。</text>
<rect x="26" y="292" width="708" height="140" rx="15" fill="#2b213a" stroke="#59406f"/>
<text x="47" y="335" class="label">記憶片段｜某一件事的細節</text>
<text x="47" y="378" class="body">「予安把銀色鑰匙交給我。」</text>
<text x="47" y="418" class="body">確認相關片段是否存在、內容是否正確。</text>
<rect x="26" y="448" width="708" height="140" rx="15" fill="#2b213a" stroke="#59406f"/>
<text x="47" y="491" class="label">使用者備註｜持續成立的事實</text>
<text x="47" y="534" class="body">「銀色鑰匙現在由我保管。」</text>
<text x="47" y="574" class="body">關係或持有人改變時，要一起更新。</text>
</svg>