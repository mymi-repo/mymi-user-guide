<svg xmlns="http://www.w3.org/2000/svg" width="760" height="628" viewBox="0 0 760 628" role="img" aria-labelledby="title desc">
<title id="title">同樣是故事，你站的位置不同</title><desc id="desc">從閱讀、委託寫作，到親自參與下一幕</desc>
<style>text{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif} .label{font-size:34px;font-weight:700;fill:#f4edff}.body{font-size:32px;fill:#d7d4e0}.sub{font-size:28px;fill:#d7d4e0}</style>
<rect width="760" height="628" rx="24" fill="#19151f"/>
<text x="36" y="57" class="label">同樣是故事，你站的位置不同</text>
<text x="36" y="100" class="sub">從閱讀、委託寫作，到親自參與下一幕</text>
<rect x="26" y="136" width="708" height="140" rx="15" fill="#2b213a" stroke="#59406f"/>
<text x="47" y="179" class="label">網路小說｜讀者</text>
<text x="47" y="222" class="body">讀作者安排好的劇情。</text>
<text x="47" y="262" class="body">「主角接下來會怎麼做？」</text>
<rect x="26" y="292" width="708" height="140" rx="15" fill="#2b213a" stroke="#59406f"/>
<text x="47" y="335" class="label">AI寫作工具｜提出要求的人</text>
<text x="47" y="378" class="body">請AI產生、改寫一段文字。</text>
<text x="47" y="418" class="body">「幫我寫一個雨夜相遇的場景。」</text>
<rect x="26" y="448" width="708" height="140" rx="15" fill="#2b213a" stroke="#59406f"/>
<text x="47" y="491" class="label">AI互動小說｜故事中的角色</text>
<text x="47" y="534" class="body">你寫自己的台詞與動作，AI接下去。</text>
<text x="47" y="574" class="body">「我把門打開，問他為什麼還沒回家。」</text>
</svg>