<svg xmlns="http://www.w3.org/2000/svg" width="760" height="628" viewBox="0 0 760 628" role="img" aria-labelledby="title desc">
<title id="title">換個方式，讀同一段故事</title><desc id="desc">閱讀方式的概念示意，並非產品操作畫面</desc>
<style>text{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif} .label{font-size:34px;font-weight:700;fill:#f4edff}.body{font-size:32px;fill:#d7d4e0}.sub{font-size:28px;fill:#d7d4e0}</style>
<rect width="760" height="628" rx="24" fill="#19151f"/>
<text x="36" y="57" class="label">換個方式，讀同一段故事</text>
<text x="36" y="100" class="sub">閱讀方式的概念示意，並非產品操作畫面</text>
<rect x="26" y="136" width="708" height="140" rx="15" fill="#2b213a" stroke="#59406f"/>
<text x="47" y="179" class="label">小說｜連續讀敘述與台詞</text>
<text x="47" y="222" class="body">把注意力放在場景與文字。</text>
<text x="47" y="262" class="body">你仍然是故事裡的一個角色。</text>
<rect x="26" y="292" width="708" height="140" rx="15" fill="#2b213a" stroke="#59406f"/>
<text x="47" y="335" class="label">聊天｜習慣一來一往的訊息</text>
<text x="47" y="378" class="body">用熟悉的聊天方式讀對話。</text>
<text x="47" y="418" class="body">切換顯示方式，不會重寫原本的故事。</text>
<rect x="26" y="448" width="708" height="140" rx="15" fill="#2b213a" stroke="#59406f"/>
<text x="47" y="491" class="label">寫作風格｜對新回覆提出要求</text>
<text x="47" y="534" class="body">這是另一項設定。</text>
<text x="47" y="574" class="body">它要求AI怎麼寫，而不是畫面怎麼顯示。</text>
</svg>