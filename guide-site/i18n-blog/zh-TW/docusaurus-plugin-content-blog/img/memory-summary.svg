<svg xmlns="http://www.w3.org/2000/svg" width="760" height="668" viewBox="0 0 760 668" role="img" aria-labelledby="title desc">
<title id="title">摘要有主線，不一定留住細節</title><desc id="desc">燈塔與鑰匙為說明而設計的虛構例子</desc>
<style>text{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif} .label{font-size:34px;font-weight:700;fill:#f4edff}.body{font-size:32px;fill:#d7d4e0}.sub{font-size:28px;fill:#d7d4e0}</style>
<rect width="760" height="668" rx="24" fill="#19151f"/>
<text x="36" y="57" class="label">摘要有主線，不一定留住細節</text>
<text x="36" y="100" class="sub">燈塔與鑰匙為說明而設計的虛構例子</text>
<rect x="26" y="136" width="708" height="140" rx="15" fill="#2b213a" stroke="#59406f"/>
<text x="47" y="179" class="label">原本發生的事</text>
<text x="47" y="222" class="body">兩人在燈塔和好。</text>
<text x="47" y="262" class="body">予安把銀色鑰匙交給我保管。</text>
<rect x="26" y="292" width="708" height="140" rx="15" fill="#2b213a" stroke="#59406f"/>
<text x="47" y="335" class="label">縮短後的摘要</text>
<text x="47" y="378" class="body">「兩人在燈塔和好。」</text>
<text x="47" y="418" class="body">事件留下來了，鑰匙的持有人卻漏了。</text>
<rect x="26" y="448" width="708" height="180" rx="15" fill="#2b213a" stroke="#59406f"/>
<text x="47" y="491" class="label">需要持續保留的備註</text>
<text x="47" y="534" class="body">「銀色鑰匙是予安交給我的，</text>
<text x="47" y="574" class="body">現在由我保管。」</text>
</svg>
