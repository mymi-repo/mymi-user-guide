<svg xmlns="http://www.w3.org/2000/svg" width="760" height="628" viewBox="0 0 760 628" role="img" aria-labelledby="title desc">
<title id="title">同样是故事，你站的位置不同</title><desc id="desc">从阅读、委托写作，到亲自参与下一幕</desc>
<style>text{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif} .label{font-size:34px;font-weight:700;fill:#f4edff}.body{font-size:32px;fill:#d7d4e0}.sub{font-size:28px;fill:#d7d4e0}</style>
<rect width="760" height="628" rx="24" fill="#19151f"/>
<text x="36" y="57" class="label">同样是故事，你站的位置不同</text>
<text x="36" y="100" class="sub">从阅读、委托写作，到亲自参与下一幕</text>
<rect x="26" y="136" width="708" height="140" rx="15" fill="#2b213a" stroke="#59406f"/>
<text x="47" y="179" class="label">网络小说｜读者</text>
<text x="47" y="222" class="body">读作者安排好的剧情。</text>
<text x="47" y="262" class="body">「主角接下来会怎么做？」</text>
<rect x="26" y="292" width="708" height="140" rx="15" fill="#2b213a" stroke="#59406f"/>
<text x="47" y="335" class="label">AI写作工具｜提出要求的人</text>
<text x="47" y="378" class="body">请AI产生、改写一段文字。</text>
<text x="47" y="418" class="body">「帮我写一个雨夜相遇的场景。」</text>
<rect x="26" y="448" width="708" height="140" rx="15" fill="#2b213a" stroke="#59406f"/>
<text x="47" y="491" class="label">AI互动小说｜故事中的角色</text>
<text x="47" y="534" class="body">你写自己的台词与动作，AI接下去。</text>
<text x="47" y="574" class="body">「我把门打开，问他为什么还没回家。」</text>
</svg>